<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="0.3" stop-color="#916fdc"/>
      <stop offset="0.58" stop-color="#7282e8"/>
      <stop offset="0.8" stop-color="#4a94e7"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <radialGradient id="bell" gradientUnits="userSpaceOnUse" cx="512" cy="320" r="330">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0e8ff"/>
    </radialGradient>
    <linearGradient id="tent" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="890">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece9ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.365" r="0.42">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- The Apple icon grid: an 824-unit square centered on the 1024 canvas. -->
    <clipPath id="grid">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="blur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect x="106" y="118" width="812" height="812" rx="182"
        fill="#000000" opacity="0.22" filter="url(#blur)"/>
  <g>
    <g clip-path="url(#grid)">
      <g transform="translate(512 512) scale(0.8047) translate(-512 -512)">
        <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
        <rect x="0" y="0" width="1024" height="1024" fill="url(#glow)"/>
        <g transform="translate(0 -26) translate(512 512) scale(1.17) translate(-512 -512)">
          <path d="M262 508
                   C262 348 372 232 512 232
                   C652 232 762 348 762 508
                   C700 478 636 528 574 508
                   C512 488 450 528 388 508
                   C346 494 304 494 262 508 Z"
                fill="url(#bell)"/>
          <g fill="url(#tent)">
            <rect x="318" y="560" width="44" height="170" rx="22"/>
            <rect x="406" y="560" width="44" height="250" rx="22"/>
            <rect x="494" y="560" width="44" height="190" rx="22"/>
            <rect x="670" y="560" width="44" height="140" rx="22"/>
          </g>
          <path d="M582 582
                   Q582 560 604 560
                   Q626 560 626 582
                   L626 867
                   Q626 874 621 869
                   L609 857
                   Q604 852 599 857
                   L587 869
                   Q582 874 582 867 Z"
                fill="url(#tent)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
