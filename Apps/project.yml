name: JellyBlair
options:
  bundleIdPrefix: com.hmblair
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
packages:
  JellyBlair:
    path: ..

# Settings both apps share, so each value has one home.
targetTemplates:
  App:
    type: application
    # One manifest for both apps, since they use the same declared APIs.
    # One asset catalog too: it holds the app icon for each platform and
    # the shared glyph image. The Icon Composer file carries the icon for
    # macOS 26 and iOS 26, and the asset catalog serves older systems.
    # The string catalog holds the localized strings for both apps and the
    # package, whose keys resolve against the app bundle.
    sources: [PrivacyInfo.xcprivacy, Assets.xcassets, AppIcon.icon, Localizable.xcstrings]
    dependencies:
      - package: JellyBlair
        product: JellyBlairKit
    settings:
      base:
        PRODUCT_NAME: JellyBlair
        # One identifier across the platforms, so the App Store treats
        # both apps as one product.
        PRODUCT_BUNDLE_IDENTIFIER: com.hmblair.jellyblair
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Placeholders for builds outside make, such as running from Xcode.
        # The make targets pass the version and the build number.
        MARKETING_VERSION: "0"
        CURRENT_PROJECT_VERSION: "0"

targets:
  JellyBlairMac:
    templates: [App]
    platform: macOS
    sources: [Mac]
    # The Mac App Store requires the App Sandbox. The network entitlement
    # covers the outgoing connections to the Jellyfin server. Everything
    # the app writes lives in Application Support, which the sandbox maps
    # into the app container.
    entitlements:
      path: Mac/JellyBlair.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: JellyBlair
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.books
        NSHumanReadableCopyright: © 2026 Hamish M. Blair
        NSHighResolutionCapable: true
        # The app uses only HTTPS, which is exempt from export compliance.
        ITSAppUsesNonExemptEncryption: false
        # A Jellyfin server often sits on the home network, which the
        # system guards behind a prompt that shows this text.
        NSLocalNetworkUsageDescription: JellyBlair connects to your Jellyfin server, which can be on your local network.

  JellyBlairiOS:
    templates: [App]
    platform: iOS
    sources: [iOS]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: JellyBlair
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.books
        # The app uses only HTTPS, which is exempt from export compliance.
        ITSAppUsesNonExemptEncryption: false
        # A Jellyfin server often sits on the home network, which the
        # system guards behind a prompt that shows this text.
        NSLocalNetworkUsageDescription: JellyBlair connects to your Jellyfin server, which can be on your local network.
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # The phone holds one column, so it stays upright. The iPad turns
        # freely, since either orientation fits a layout.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # The phone and the iPad. UIRequiresFullScreen stays unset, so the
        # app takes part in Split View and Stage Manager, whose narrow
        # windows the compact layout covers.
        TARGETED_DEVICE_FAMILY: "1,2"
