name: JellyBlairiOS
options:
  bundleIdPrefix: com.hmblair
  deploymentTarget:
    iOS: "18.0"
packages:
  JellyBlair:
    path: ..
targets:
  JellyBlairiOS:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: JellyBlair
        product: JellyBlairKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: JellyBlair
        # Resolved at build time; make iphone passes it from the VERSION file.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Resolved at build time; make iphone passes it from the commit count.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        # The same identifier as the macOS bundle, so the App Store treats
        # both platforms as one product.
        PRODUCT_BUNDLE_IDENTIFIER: com.hmblair.jellyblair
        CODE_SIGN_STYLE: Automatic
        # Placeholders for builds outside make, such as running from Xcode.
        MARKETING_VERSION: "0"
        CURRENT_PROJECT_VERSION: "0"
        # The signing team comes from Makefile.local through make iphone,
        # or from your own selection when building in Xcode.
        TARGETED_DEVICE_FAMILY: "1"
